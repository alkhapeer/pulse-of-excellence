<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0B1F" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نبض التميز">
<title>نبض التميز — رفيقك اليومي</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM v5.0
   ============================================================ */
:root{
  --primary:#7C3AED; --primary-dark:#4C1D95; --primary-light:#A78BFA;
  --coral:#FF6B9D; --coral-dark:#E11D74;
  --mint:#06D6A0; --mint-dark:#059669;
  --gold:#FFD166; --gold-dark:#E8A020;
  --sky:#4ECDC4;
  --bg:#F8F7FC; --bg-2:#F0EFF6; --card:#FFFFFF;
  --txt:#0E0B1F; --txt-2:#4A4266; --txt-3:#9591AB;
  --line:#E2E0EB;
  --grad-royal:linear-gradient(135deg,#7C3AED 0%,#4C1D95 100%);
  --grad-cosmic:linear-gradient(135deg,#7C3AED 0%,#FF6B9D 100%);
  --grad-sunset:linear-gradient(135deg,#FF6B9D 0%,#FFD166 100%);
  --grad-mint:linear-gradient(135deg,#06D6A0 0%,#4ECDC4 100%);
  --grad-ocean:linear-gradient(135deg,#4ECDC4 0%,#7C3AED 100%);
  --grad-hero:linear-gradient(160deg,#0F0B1F 0%,#2D1B5E 45%,#4C1D95 100%);
  --grad-glass:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.06));
  --sh-sm:0 4px 12px rgba(15,11,31,.08);
  --sh-md:0 12px 32px rgba(15,11,31,.10);
  --sh-lg:0 24px 56px rgba(15,11,31,.14);
  --sh-violet:0 16px 40px rgba(124,58,237,.32);
  --sh-coral:0 16px 40px rgba(255,107,157,.32);
  --sh-mint:0 16px 40px rgba(6,214,160,.32);
  --sh-gold:0 16px 40px rgba(255,209,102,.32);
  --r-xs:12px;--r-sm:16px;--r-md:22px;--r-lg:28px;--r-xl:36px;--r-full:9999px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --font-ar:'Tajawal',system-ui,sans-serif;
  --font-en:'Nunito',system-ui,sans-serif;
  --transition-fast:.15s cubic-bezier(.22,1,.36,1);
  --transition:  .3s  cubic-bezier(.22,1,.36,1);
  --transition-slow: .6s cubic-bezier(.22,1,.36,1);
}

/* ============ DARK MODE ============ */
[data-theme="dark"]{
  --bg:#0A0817; --bg-2:#14102A; --card:#1A1633;
  --txt:#F5F3FF; --txt-2:#C4B5FD; --txt-3:#8B7DB8;
  --line:#2D2645;
  --sh-sm:0 4px 12px rgba(0,0,0,.3);
  --sh-md:0 12px 32px rgba(0,0,0,.4);
  --sh-lg:0 24px 56px rgba(0,0,0,.5);
}
[data-theme="dark"] .topbar{
  background:rgba(10,8,23,.85); border-bottom-color:rgba(255,255,255,.06);
}
[data-theme="dark"] .topbar #topTitle{color:#F5F3FF}
[data-theme="dark"] .icon-btn{background:#1A1633;color:#F5F3FF}
[data-theme="dark"] .bottom-nav{
  background:rgba(10,8,23,.92); border-top-color:rgba(255,255,255,.06);
}
[data-theme="dark"] .bottom-nav button.active{color:#A78BFA}
[data-theme="dark"] .card,[data-theme="dark"] .today-activity,
[data-theme="dark"] .domain-row,[data-theme="dark"] .pill,
[data-theme="dark"] .act-card,[data-theme="dark"] .week-card,
[data-theme="dark"] .stat-card,[data-theme="dark"] .modal-sheet{
  background:var(--card); border-color:rgba(255,255,255,.06);
}
[data-theme="dark"] .chip,[data-theme="dark"] .q-opt,
[data-theme="dark"] .field input,[data-theme="dark"] .field select,
[data-theme="dark"] .field textarea{
  background:var(--bg-2); color:var(--txt); border-color:var(--line);
}
[data-theme="dark"] .mood-chip{background:rgba(255,255,255,.06)}
[data-theme="dark"] .day-dot{background:var(--bg-2);color:var(--txt-3)}
[data-theme="dark"] .bar-wrap,[data-theme="dark"] .track{
  background:var(--bg-2);
}
[data-theme="dark"] .empty-state{background:var(--card)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:var(--font-ar); background:var(--bg); color:var(--txt);
  line-height:1.65; font-size:16px; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none; transition:background var(--transition),color var(--transition);
}
html[dir="ltr"] body{font-family:var(--font-en)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
img,svg{display:block;max-width:100%}

/* ============ MASCOT "Nabd" ============ */
.mascot-container{
  position:fixed; bottom:calc(var(--safe-b) + 100px);
  inset-inline-end:18px; z-index:60;
  display:flex; flex-direction:column; align-items:flex-end;
  pointer-events:none;
}
.mascot-bubble{
  max-width:240px; padding:14px 18px;
  background:var(--card); border-radius:20px 20px 4px 20px;
  box-shadow:var(--sh-md); font-size:13.5px; font-weight:600;
  line-height:1.5; color:var(--txt);
  margin-bottom:10px; position:relative;
  opacity:0; transform:translateY(10px) scale(.9);
  transition:all .4s cubic-bezier(.22,1,.36,1);
  pointer-events:auto;
}
html[dir="ltr"] .mascot-bubble{border-radius:20px 20px 20px 4px}
.mascot-bubble.show{opacity:1;transform:translateY(0) scale(1)}
.mascot-bubble::after{
  content:''; position:absolute; bottom:-8px; inset-inline-end:20px;
  width:16px;height:16px;background:var(--card);
  transform:rotate(45deg); box-shadow:var(--sh-sm);
}
.mascot-bubble .close-btn{
  position:absolute; top:-8px; inset-inline-start:-8px;
  width:24px;height:24px;border-radius:50%;
  background:var(--txt-3);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  pointer-events:auto;
}
.mascot{
  width:76px;height:76px;position:relative;
  pointer-events:auto; cursor:pointer;
  transition:transform var(--transition-fast);
  filter:drop-shadow(0 8px 20px rgba(124,58,237,.3));
}
.mascot:active{transform:scale(.92)}
.mascot-svg{width:100%;height:100%}
.mascot-svg .eye{animation:mascotBlink 4s infinite}
@keyframes mascotBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot-svg .wing{transform-origin:center;animation:mascotWave 3s ease-in-out infinite}
@keyframes mascotWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.mascot-svg .ear{transform-origin:center;animation:mascotEar 2.6s ease-in-out infinite}
@keyframes mascotEar{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.mascot.idle .mascot-svg{animation:mascotIdle 3s ease-in-out infinite}
@keyframes mascotIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mascot.celebrate .mascot-svg{animation:mascotCelebrate .8s ease-in-out 3}
@keyframes mascotCelebrate{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-14px) rotate(-8deg)}
  75%{transform:translateY(-14px) rotate(8deg)}
}
.mascot-hide{
  opacity:0;transform:scale(0);transition:all .3s;
}

/* ============ VERSION UPDATE BANNER ============ */
.update-banner{
  position:fixed; top:calc(var(--safe-t) + 12px);
  inset-inline:18px; z-index:70;
  padding:14px 18px; border-radius:var(--r-md);
  background:var(--grad-cosmic); color:#fff;
  box-shadow:var(--sh-violet);
  display:none; align-items:center; gap:12px;
  animation:slideDown .4s cubic-bezier(.22,1,.36,1);
}
.update-banner.show{display:flex}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.update-banner .ub-icon{font-size:24px}
.update-banner .ub-body{flex:1;font-size:13px;font-weight:700;line-height:1.4}
.update-banner button{
  padding:9px 14px;border-radius:12px;
  background:rgba(255,255,255,.22);color:#fff;
  font-size:12.5px;font-weight:800;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.28);
}

/* ============ AMBIENT ORBS ============ */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;transition:opacity var(--transition)}
[data-theme="dark"] .orb{opacity:.2}
.orb.o1{width:340px;height:340px;background:var(--primary-light);top:-100px;inset-inline-end:-80px;animation:float1 18s ease-in-out infinite}
.orb.o2{width:280px;height:280px;background:#FF8FB8;bottom:-80px;inset-inline-start:-60px;animation:float2 22s ease-in-out infinite}
.orb.o3{width:220px;height:220px;background:#3EE4B7;top:40%;inset-inline-start:-100px;animation:float3 26s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,40px) scale(1.1)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,30px) scale(1.05)}}

#app{position:relative;z-index:1;min-height:100vh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  padding:calc(var(--safe-t) + 14px) 18px 14px;
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(24px) saturate(1.6);
  border-bottom:1px solid transparent;transition:all var(--transition);
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar.dark{background:rgba(15,11,31,.65);border-bottom-color:rgba(255,255,255,.08)}
.topbar.dark #topTitle{color:#fff}
.topbar.dark .icon-btn{background:rgba(255,255,255,.12);color:#fff}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--card);box-shadow:var(--sh-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:var(--txt);
  transition:all var(--transition-fast);flex-shrink:0;
}
.icon-btn:active{transform:scale(.9)}
.icon-btn.hidden{visibility:hidden}
#topTitle{
  font-size:17px;font-weight:800;flex:1;text-align:center;
  color:var(--txt);padding-inline:44px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.child-avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:var(--grad-cosmic);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;box-shadow:var(--sh-violet);
  cursor:pointer;border:2px solid var(--card);transition:transform var(--transition-fast);
}
.child-avatar:active{transform:scale(.92)}

/* ============ SCREENS ============ */
.screen{display:none;flex:1;flex-direction:column;padding:8px 18px calc(var(--safe-b) + 110px);animation:screenIn .45s cubic-bezier(.22,1,.36,1)}
.screen.active{display:flex}
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ============ BUTTONS ============ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px 22px;border-radius:var(--r-md);
  font-size:16px;font-weight:800;transition:all var(--transition-fast);
  background:var(--bg-2);color:var(--txt);position:relative;overflow:hidden;
}
.btn.primary{background:var(--grad-cosmic);color:#fff;box-shadow:var(--sh-violet)}
.btn.primary::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:translateX(-100%);animation:shine 3s infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.btn.primary:active{transform:translateY(2px) scale(.98);box-shadow:0 8px 20px rgba(124,58,237,.3)}
.btn.mint{background:var(--grad-mint);color:#fff;box-shadow:var(--sh-mint)}
.btn.gold{background:var(--grad-sunset);color:#fff;box-shadow:var(--sh-gold)}
.btn.ghost{background:transparent;color:var(--primary);font-weight:800}
.btn.light{background:var(--card);box-shadow:var(--sh-sm)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-sm{padding:10px 16px;font-size:13.5px;border-radius:12px;width:auto;font-weight:800}

/* ============ CARDS ============ */
.card{background:var(--card);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-md);margin-bottom:14px;border:1px solid rgba(15,11,31,.04);position:relative;overflow:hidden}
.card.gradient{background:var(--grad-royal);color:#fff;box-shadow:var(--sh-violet)}
.card.gradient::after{content:'';position:absolute;top:-50%;inset-inline-end:-50%;width:200%;height:200%;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
.card h3{font-size:18px;font-weight:800;margin-bottom:10px;position:relative;z-index:1}
.card p{font-size:14.5px;line-height:1.75;position:relative;z-index:1}

/* ============ FORM ============ */
.field{margin-bottom:18px}
.field label{display:block;font-size:13.5px;font-weight:800;margin-bottom:10px;color:var(--txt-2)}
.field label .req{color:var(--coral)}
.field input,.field select,.field textarea{
  width:100%;padding:18px 20px;border-radius:var(--r-md);
  border:2px solid var(--line);background:var(--card);
  font-size:16px;font-weight:600;transition:all var(--transition-fast);
  -webkit-appearance:none;appearance:none;color:var(--txt);
}
.field textarea{min-height:100px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(124,58,237,.12);
}
.field select{
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C3AED' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:left 20px center;background-size:16px;padding-inline-start:52px;
}
html[dir="ltr"] .field select{background-position:right 20px center;padding-inline-start:20px;padding-inline-end:52px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:13px 20px;border-radius:var(--r-md);background:var(--card);border:2px solid var(--line);font-size:14.5px;font-weight:700;color:var(--txt-2);transition:all var(--transition-fast)}
.chip.active{background:var(--grad-cosmic);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(124,58,237,.3)}

/* ============ HOME HERO ============ */
.home-hero{padding:26px 22px;border-radius:var(--r-xl);background:var(--grad-hero);color:#fff;box-shadow:var(--sh-violet);margin-bottom:16px;position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% 0%,rgba(255,107,157,.35),transparent 45%),radial-gradient(circle at 0% 100%,rgba(6,214,160,.25),transparent 45%);pointer-events:none}
.home-hero > *{position:relative;z-index:1}
.home-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.home-greet{font-size:14px;font-weight:600;opacity:.85}
.home-name{font-size:20px;font-weight:900;margin-top:2px;letter-spacing:-.3px}
.streak-badge{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--r-full);background:var(--grad-sunset);color:#fff;font-size:15px;font-weight:900;box-shadow:0 8px 20px rgba(255,107,157,.4);animation:streakPulse 2.4s ease-in-out infinite}
@keyframes streakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.streak-badge .flame{font-size:20px}
.streak-badge .num{font-size:22px;line-height:1}
.streak-badge .lbl{font-size:11px;opacity:.9;font-weight:700}
.home-daily-mood{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r-md);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);margin-bottom:16px}
.home-daily-mood .q{font-size:13.5px;font-weight:700;opacity:.9;text-align:center}
.mood-chips{display:flex;justify-content:center;gap:8px}
.mood-chip{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:24px;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast)}
.mood-chip:active{transform:scale(.92)}
.mood-chip.selected{background:rgba(255,255,255,.3);border-color:#fff;transform:scale(1.08);box-shadow:0 8px 20px rgba(255,255,255,.2)}

.today-activity{background:var(--card);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-md);margin-bottom:16px;position:relative;overflow:hidden;border:1px solid rgba(15,11,31,.04)}
.today-activity::before{content:'';position:absolute;top:0;inset-inline:0;height:6px;background:var(--grad-cosmic)}
.today-activity.done::before{background:var(--grad-mint)}
.today-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);background:#EDE9FE;color:var(--primary-dark);font-size:11.5px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;margin-bottom:12px}
.today-activity.done .today-tag{background:#D9F9EE;color:var(--mint-dark)}
.today-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#EDE9FE,#FFE4EE);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.today-activity.done .today-icon{background:#D9F9EE}
.today-activity h3{font-size:20px;font-weight:900;margin-bottom:6px;letter-spacing:-.3px;color:var(--txt)}
.today-activity .subtitle{font-size:13.5px;color:var(--txt-3);line-height:1.6;margin-bottom:14px}
.today-activity .meta-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.a-tag{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--r-full);font-size:12px;font-weight:800;background:var(--bg-2);color:var(--txt-2)}
.a-tag.violet{background:#EDE9FE;color:var(--primary-dark)}
.a-tag.coral{background:#FFE4EE;color:var(--coral-dark)}
.a-tag.mint{background:#D9F9EE;color:var(--mint-dark)}
.today-activity .done-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-full);background:var(--grad-mint);color:#fff;font-size:13px;font-weight:900;box-shadow:var(--sh-mint)}

.week-progress-card{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm);margin-bottom:14px}
.week-progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.week-progress-head .lbl{font-size:13px;font-weight:800;color:var(--txt-3)}
.week-progress-head .pct{font-size:20px;font-weight:900;color:var(--primary)}
.week-dots{display:flex;justify-content:space-between;gap:6px;margin-top:12px}
.day-dot{flex:1;aspect-ratio:1;max-width:40px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--txt-3);position:relative;transition:all var(--transition)}
.day-dot.today{box-shadow:0 0 0 3px var(--primary-light)}
.day-dot.done{background:var(--grad-mint);color:#fff}
.day-dot.done::after{content:'✓';font-size:14px;font-weight:900}
.day-dot.future{opacity:.4}
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:var(--r-md);padding:16px 12px;box-shadow:var(--sh-sm);text-align:center}
.stat-card .ic{font-size:22px;margin-bottom:6px}
.stat-card .val{font-size:22px;font-weight:900;color:var(--txt);line-height:1}
.stat-card .lbl{font-size:11px;font-weight:800;color:var(--txt-3);margin-top:4px}

/* ============ ACTIVITY CARDS ============ */
.act-card{background:var(--card);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh-sm);margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;border:1px solid rgba(15,11,31,.04);transition:transform var(--transition-fast)}
.act-card:active{transform:scale(.99)}
.act-card.done{opacity:.7}
.act-card .ac-ic{width:52px;height:52px;border-radius:16px;flex-shrink:0;background:linear-gradient(135deg,#EDE9FE,#FFE4EE);display:flex;align-items:center;justify-content:center;font-size:24px}
.act-card.done .ac-ic{background:#D9F9EE}
.act-card .body{flex:1;min-width:0}
.act-card h5{font-size:14.5px;font-weight:800;margin-bottom:3px;color:var(--txt)}
.act-card .domain-lbl{font-size:11.5px;font-weight:800;color:var(--primary);margin-bottom:6px}
.act-card p{font-size:12.5px;color:var(--txt-3);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.act-card .chk{width:28px;height:28px;border-radius:50%;flex-shrink:0;border:2.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.act-card.done .chk{background:var(--grad-mint);border-color:transparent;box-shadow:var(--sh-mint)}
.act-card.done .chk::after{content:'✓';font-size:15px}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(15,11,31,.55);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .25s}
.modal-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{width:100%;max-width:520px;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:24px 22px calc(var(--safe-b) + 24px);animation:slideUp .35s cubic-bezier(.22,1,.36,1);max-height:88vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-grip{width:44px;height:5px;background:var(--line);border-radius:99px;margin:0 auto 18px}
.modal-sheet h3{font-size:20px;font-weight:900;margin-bottom:8px;color:var(--txt)}
.modal-sheet .sub{font-size:13.5px;color:var(--txt-3);margin-bottom:20px;line-height:1.6}
.mood-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:20px}
.mood-row .mo{flex:1;aspect-ratio:1;max-width:64px;border-radius:18px;background:var(--bg);border:2px solid var(--line);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all var(--transition-fast);padding:4px}
.mood-row .mo span{font-size:9px;font-weight:800;color:var(--txt-3)}
.mood-row .mo.selected{border-color:var(--primary);background:#F5F3FF;transform:scale(1.08)}
.mood-row .mo.selected span{color:var(--primary)}

/* ============ BOTTOM NAV ============ */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,255,255,.92);backdrop-filter:blur(28px) saturate(1.6);border-top:1px solid rgba(15,11,31,.06);padding:8px 8px calc(var(--safe-b) + 8px);display:none;justify-content:space-around;z-index:40;box-shadow:0 -8px 24px rgba(15,11,31,.06)}
.bottom-nav.show{display:flex}
.bottom-nav button{flex:1;padding:8px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:var(--txt-3);transition:all var(--transition-fast);position:relative}
.bottom-nav button .ic{font-size:22px;line-height:1;transition:transform var(--transition-fast)}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav button.active .ic{transform:scale(1.15) translateY(-1px)}
.bottom-nav button.center-btn .ic{background:var(--grad-cosmic);color:#fff;width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-24px;box-shadow:var(--sh-violet);border:3px solid var(--card)}
.bottom-nav button.center-btn.active .ic{transform:scale(1.08) translateY(-24px)}
.bottom-nav button.center-btn span:not(.ic){margin-top:-4px}

/* ============ UTILITIES ============ */
.sec-title{font-size:12.5px;font-weight:900;color:var(--txt-3);margin:22px 4px 12px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-title::before{content:'';width:4px;height:16px;border-radius:99px;background:var(--grad-cosmic)}
.spacer{flex:1}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-20{margin-top:20px}
.muted{color:var(--txt-3);font-size:13px;line-height:1.6}
.empty-state{text-align:center;padding:40px 20px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.empty-state .em{font-size:48px;margin-bottom:12px;opacity:.6}
.empty-state h4{font-size:16px;font-weight:800;margin-bottom:6px;color:var(--txt-2)}
.empty-state p{font-size:13px;color:var(--txt-3);line-height:1.6}
.toast{position:fixed;bottom:calc(var(--safe-b) + 130px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:14px 22px;border-radius:var(--r-md);font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all var(--transition);z-index:999;box-shadow:var(--sh-lg);max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti-piece{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:998;animation:confettiFall 3.2s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes confettiFall{0%{transform:translateY(-20vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<!-- Ambient background -->
<div class="ambient" aria-hidden="true">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</div>

<!-- Update banner -->
<div class="update-banner" id="updateBanner">
  <span class="ub-icon">🎉</span>
  <div class="ub-body" id="updateBannerText">تحديث جديد متاح!</div>
  <button onclick="applyUpdate()" data-i18n="settings.updateNow">تحديث الآن</button>
</div>

<!-- Mascot -->
<div class="mascot-container" id="mascotContainer">
  <div class="mascot-bubble" id="mascotBubble">
    <button class="close-btn" onclick="hideMascotBubble()">✕</button>
    <span id="mascotText"></span>
  </div>
  <div class="mascot idle" id="mascot" onclick="mascotSpeak()">
    <svg class="mascot-svg" viewBox="0 0 100 100">
      <!-- Owl body -->
      <ellipse cx="50" cy="58" rx="32" ry="36" fill="#7C3AED"/>
      <!-- Belly -->
      <ellipse cx="50" cy="68" rx="22" ry="24" fill="#EDE9FE"/>
      <!-- Head top -->
      <ellipse cx="50" cy="34" rx="30" ry="26" fill="#7C3AED"/>
      <!-- Ear tufts -->
      <path class="ear" d="M28 14 L34 26 L22 22 Z" fill="#7C3AED"/>
      <path class="ear" d="M72 14 L66 26 L78 22 Z" fill="#7C3AED"/>
      <!-- Eyes -->
      <circle cx="38" cy="36" r="10" fill="#fff"/>
      <circle cx="62" cy="36" r="10" fill="#fff"/>
      <circle class="eye" cx="38" cy="36" r="5" fill="#0F0B1F"/>
      <circle class="eye" cx="62" cy="36" r="5" fill="#0F0B1F"/>
      <!-- Eye shine -->
      <circle cx="40" cy="34" r="1.5" fill="#fff"/>
      <circle cx="64" cy="34" r="1.5" fill="#fff"/>
      <!-- Beak -->
      <path d="M47 44 L53 44 L50 50 Z" fill="#FFD166"/>
      <!-- Wings -->
      <path class="wing" d="M18 55 Q10 62 18 72 Q22 70 24 60 Z" fill="#6D28D9"/>
      <path class="wing" d="M82 55 Q90 62 82 72 Q78 70 76 60 Z" fill="#6D28D9"/>
      <!-- Feet -->
      <path d="M42 92 L42 96 M38 96 L46 96" stroke="#FFD166" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M58 92 L58 96 M54 96 L62 96" stroke="#FFD166" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<div id="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn hidden" id="backBtn" aria-label="Back">←</button>
    <h1 id="topTitle" data-i18n="app.name">نبض التميز</h1>
    <div class="child-avatar" id="childAvatar" style="display:none" title="Profile">👶</div>
  </header>

  <main id="main">
    <!-- Onboarding screens will be injected here -->
    <div id="screensContainer"></div>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-target="s-home" data-i18n-btn="home"><span class="ic">🏠</span><span data-i18n="nav.home">الرئيسية</span></button>
    <button data-target="s-activities" data-i18n-btn="activities"><span class="ic">🎯</span><span data-i18n="nav.activities">الأنشطة</span></button>
    <button class="center-btn" id="logCenterBtn"><span class="ic">➕</span><span data-i18n="nav.log">تسجيل</span></button>
    <button data-target="s-progress" data-i18n-btn="progress"><span class="ic">📊</span><span data-i18n="nav.progress">التقدم</span></button>
    <button data-target="s-profile" data-i18n-btn="profile"><span class="ic">👤</span><span data-i18n="nav.profile">الملف</span></button>
  </nav>

  <div class="modal-overlay" id="logModal">
    <div class="modal-sheet">
      <div class="modal-grip"></div>
      <h3 data-i18n="log.title">سجّل نشاط اليوم ✨</h3>
      <p class="sub" id="logActivityName">—</p>
      <div style="font-size:13.5px;font-weight:800;color:var(--txt-2);margin-bottom:10px" data-i18n="log.howWasIt">كيف كانت تجربتك؟</div>
      <div class="mood-row" id="logMoodRow">
        <button class="mo" data-mood="5">🤩<span data-i18n="log.moods.excellent">ممتاز</span></button>
        <button class="mo" data-mood="4">😊<span data-i18n="log.moods.good">جيد</span></button>
        <button class="mo" data-mood="3">😐<span data-i18n="log.moods.okay">عادي</span></button>
        <button class="mo" data-mood="2">😔<span data-i18n="log.moods.hard">صعب</span></button>
        <button class="mo" data-mood="1">😤<span data-i18n="log.moods.failed">لم ينجح</span></button>
      </div>
      <div class="field">
        <label data-i18n="log.note">📝 ملاحظة (اختياري)</label>
        <textarea id="logNote" maxlength="200" data-i18n-placeholder="log.notePlaceholder" placeholder="مثال: تفاعل بحماس..."></textarea>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn" id="cancelLog" style="flex:0 0 auto;padding:16px 22px" data-i18n="log.cancel">إلغاء</button>
        <button class="btn primary" id="confirmLog" style="flex:1" data-i18n="log.save">حفظ التسجيل 🎉</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   NABD AL-TAMAYOZ v5.0 — Application Logic
   ============================================================ */

/* ============ CONSTANTS ============ */
const APP_VERSION = "1.4.0";
const VERSION_CHECK_INTERVAL = 6 * 60 * 60 * 1000; // 6 hours
const VERSION_STORAGE_KEY = 'nabd_version';
const STATE_STORAGE_KEY = 'nabd_v5';

/* ============ DATA (loaded from JSON, with fallback inline) ============ */
let QUESTIONS = [];
let ACTIVITIES = {};
let i18n = { ar: {}, en: {} };
let currentLang = 'ar';

/* ============ STATE ============ */
const DEFAULT_STATE = {
  onboarded: false,
  children: [],
  activeChildId: null,
  settings: {
    notifications: false,
    reminderTime: '19:00',
    darkMode: false,
    soundEffects: true,
    language: 'ar'
  },
  lastVersionCheck: 0,
  seenVersion: APP_VERSION
};

let State = { ...DEFAULT_STATE };

/* ============ HELPERS ============ */
const $  = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>Array.from(p.querySelectorAll(s));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayKey(d=new Date()){ return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function t(key, vars){
  const parts = key.split('.');
  let val = i18n[currentLang];
  for(const p of parts){ val = val?.[p]; }
  if(typeof val !== 'string') return key;
  if(vars) Object.keys(vars).forEach(k => { val = val.replace(`{${k}}`, vars[k]); });
  return val;
}
function isRTL(){ return currentLang === 'ar'; }
function applyLang(lang){
  currentLang = lang;
  State.settings.language = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = isRTL() ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  save();
}

/* ============ STORAGE ============ */
function save(){ try{ localStorage.setItem(STATE_STORAGE_KEY, JSON.stringify(State)); }catch(e){} }
function load(){
  try{
    const s = localStorage.getItem(STATE_STORAGE_KEY);
    if(s){ State = { ...DEFAULT_STATE, ...JSON.parse(s) }; State.settings = { ...DEFAULT_STATE.settings, ...(State.settings||{}) }; }
  }catch(e){}
}

/* ============ SOUND ENGINE (Web Audio API) ============ */
const Sound = (() => {
  let ctx = null;
  function init(){
    if(!ctx){
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if(ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function beep({freq=800, duration=0.08, type='sine', volume=0.15, delay=0, slideTo=null}={}){
    if(!State.settings.soundEffects) return;
    const c = init(); if(!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration + 0.02);
  }
  return {
    click(){ beep({freq:900, duration:0.06, type:'sine', volume:0.12}); },
    tap(){ beep({freq:600, duration:0.05, type:'triangle', volume:0.1}); },
    success(){
      beep({freq:523, duration:0.15, type:'sine', volume:0.18, delay:0});
      beep({freq:659, duration:0.15, type:'sine', volume:0.18, delay:0.12});
      beep({freq:784, duration:0.25, type:'sine', volume:0.18, delay:0.24});
    },
    celebrate(){
      const notes = [523, 659, 784, 1047, 784, 1047];
      notes.forEach((f,i) => beep({freq:f, duration:0.16, type:'triangle', volume:0.15, delay:i*0.09}));
    },
    streak(){
      beep({freq:880, duration:0.1, type:'square', volume:0.1, slideTo:1200});
    },
    error(){
      beep({freq:300, duration:0.2, type:'sawtooth', volume:0.15, slideTo:150});
    },
    unlock(){ init(); }
  };
})();

/* ============ MASCOT ============ */
const Mascot = {
  timer: null,
  hideTimer: null,
  speak(message, duration=6000){
    clearTimeout(this.hideTimer);
    const bubble = $('#mascotBubble');
    $('#mascotText').textContent = message;
    bubble.classList.add('show');
    Sound.tap();
    this.hideTimer = setTimeout(()=>this.hide(), duration);
  },
  hide(){ $('#mascotBubble').classList.remove('show'); },
  celebrate(){
    const m = $('#mascot');
    m.classList.add('celebrate');
    setTimeout(()=>m.classList.remove('celebrate'), 2600);
  },
  greetDaily(){
    const hour = new Date().getHours();
    const period = hour<12 ? 'morning' : hour<18 ? 'afternoon' : 'evening';
    const msgs = i18n[currentLang]?.mascot?.[period] || [];
    const msg = msgs[Math.floor(Math.random()*msgs.length)] || '...';
    this.speak(msg);
  },
  idleTalk(){
    const msgs = i18n[currentLang]?.mascot?.[
      new Date().getHours()<12 ? 'morning' : new Date().getHours()<18 ? 'afternoon' : 'evening'
    ] || [];
    const msg = msgs[Math.floor(Math.random()*msgs.length)] || '...';
    this.speak(msg, 4000);
  }
};
function hideMascotBubble(){ Mascot.hide(); }
function mascotSpeak(){ Mascot.idleTalk(); }

/* ============ VERSION CHECK ============ */
async function checkVersion(force=false){
  const now = Date.now();
  if(!force && (now - State.lastVersionCheck) < VERSION_CHECK_INTERVAL) return;
  try {
    const res = await fetch('./version.json?t=' + now, { cache: 'no-store' });
    if(!res.ok) return;
    const data = await res.json();
    State.lastVersionCheck = now;
    save();
    if(data.version && data.version !== APP_VERSION){
      showUpdateBanner(data);
    }
  } catch(e){ console.warn('Version check failed:', e); }
}
function showUpdateBanner(data){
  const banner = $('#updateBanner');
  $('#updateBannerText').textContent = `${t('settings.updateAvailable')} v${data.version}`;
  banner.classList.add('show');
  window._updateData = data;
}
async function applyUpdate(){
  const banner = $('#updateBanner');
  banner.classList.remove('show');
  // Tell SW to skip waiting
  if(navigator.serviceWorker?.controller){
    navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
  }
  setTimeout(()=>location.reload(), 400);
}
// Register listener for SW updates
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (e)=>{
    if(e.data?.type === 'VERSION_CHECK'){
      if(e.data.data?.version && e.data.data.version !== APP_VERSION){
        showUpdateBanner(e.data.data);
      }
    }
  });
}

/* ============ CONFETTI ============ */
function fireConfetti(){
  const colors = ['#7C3AED','#FF6B9D','#06D6A0','#FFD166','#4ECDC4'];
  for(let i=0;i<80;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.6) + 's';
    p.style.animationDuration = (2.6 + Math.random()*1.2) + 's';
    if(Math.random()>0.6) p.style.borderRadius = '50%';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 4200);
  }
}

/* ============ TOAST ============ */
function showToast(msg, ms=2600){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), ms);
}

/* ============ THEME ============ */
function applyTheme(){
  const theme = State.settings.darkMode ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeColorMeta').content = theme==='dark' ? '#0A0817' : '#F8F7FC';
  save();
}
function toggleDarkMode(){
  State.settings.darkMode = !State.settings.darkMode;
  applyTheme();
  Sound.click();
}

/* ============ SOCIAL SHARE ============ */
async function shareAchievement(type, data){
  let text = '';
  if(type === 'streak'){
    text = t('social.shareStreak', { n: data.n });
  } else if(type === 'activity'){
    text = t('social.shareActivity', { title: data.title });
  } else if(type === 'assessment'){
    text = t('social.shareAssessment');
  }
  const url = location.href;
  if(navigator.share){
    try {
      await navigator.share({ title: t('social.shareTitle'), text, url });
      return;
    } catch(e){ if(e.name === 'AbortError') return; }
  }
  // Fallback: copy to clipboard
  try {
    await navigator.clipboard.writeText(text + '\n' + url);
    showToast(t('social.shared'));
  } catch(e){
    showToast(text);
  }
}

/* ============ INITIALIZATION ============ */
async function loadDataFiles(){
  // Try to load from JSON files (network or cache)
  const load = async (path) => {
    try {
      const r = await fetch(path, { cache: 'no-cache' });
      if(r.ok) return await r.json();
    } catch(e){}
    return null;
  };
  const [qs, acts, ar, en] = await Promise.all([
    load('./data/questions.json'),
    load('./data/activities.json'),
    load('./data/i18n-ar.json'),
    load('./data/i18n-en.json')
  ]);
  if(qs?.questions) QUESTIONS = qs.questions;
  if(acts?.activities) ACTIVITIES = acts.activities;
  if(ar) i18n.ar = ar;
  if(en) i18n.en = en;
}

/* ============ BOOT ============ */
async function boot(){
  load();
  await loadDataFiles();
  applyLang(State.settings.language || 'ar');
  applyTheme();
  // Version check
  checkVersion();
  setInterval(()=>checkVersion(), VERSION_CHECK_INTERVAL);
  // Welcome mascot
  setTimeout(()=>{
    if(State.onboarded) Mascot.greetDaily();
  }, 1200);
  // Route
  if(State.onboarded && State.children.length){
    renderHome();
    go('home');
  } else {
    go('welcome');
  }
}
document.addEventListener('DOMContentLoaded', boot);
document.addEventListener('click', () => Sound.unlock(), { once:true });
</script>
</body>
